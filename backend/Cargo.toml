[package]
name = "ryu-checks"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Node-local agentic verification sidecar for Ryu Tests."
repository = "https://github.com/amajorai/ryu"

[[bin]]
name = "ryu-checks"
path = "src/main.rs"

[lib]
name = "ryu_checks"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
axum = "0.7"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
ryu-sidecar-runtime = { path = "../crates/core/sidecar-runtime", version = "0.5.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
# Phase-2 content sealing (encb:v1 / RYU-CB01 / blind indexes). No OS keychain
# backend: the key arrives from Core (RYU_SEAL_KEY) or RYU_MASTER_KEY.
ryu-crypto = { path = "../crates/core/crypto", version = "0.5.1", default-features = false }
# Phase-2 standalone root key: generated (rand) and stored base64 under
# <plugin data dir>/secrets/ when the app runs without Core.
rand = "0.8"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
